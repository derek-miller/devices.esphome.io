---
name: Preview Deploy (GitHub Pages)

# Preview deploy for testing this fork's device browser. The production site
# is built and served by Netlify (netlify.toml) from the domain root; this
# workflow publishes the same build to a GitHub Pages project site, which is
# served from a sub-path. astro.config.mjs picks the sub-path up via
# $SITE_BASE / $SITE_URL, and scripts/prefix-base.ts fixes up hand-written
# root-absolute links that Astro cannot rewrite on its own.
#
# Requires, in the repository settings:
#   * Actions -> General -> "Allow all actions" (forks start with Actions off)
#   * Pages -> Build and deployment -> Source: "GitHub Actions"
#     (the configure-pages step below also tries to set this automatically)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/device-search-facets-images-argnam

concurrency:
  group: preview-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages via the API if it is not enabled yet, so the first
          # run does not fail on a repository that has never used Pages.
          enablement: true
      - name: Build site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run build
      - name: Rewrite root-absolute URLs for sub-path hosting
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: npx tsx scripts/prefix-base.ts dist "$SITE_BASE"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy preview
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
